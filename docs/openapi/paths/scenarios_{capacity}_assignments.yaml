parameters:
  - $ref: ../components/parameters.yaml#/Capacity
put:
  tags: [scenarios]
  operationId: acceptProposal
  summary: Accept a proposal — replace the plan's tables and assignments (UC-10)
  description: |
    Version-checked against `basedOnVersion`. Disabled members of each cluster are seated with
    their cluster; clusters that were pinned stay pinned. Bumps the scenario version.
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: ../components/schemas.yaml#/AcceptPlan
        example:
          basedOnVersion: 7
          tables:
            - number: 1
              guestIds: [4, 5, 6, 7, 10, 11, 12, 13]
            - number: 2
              guestIds: [1, 2, 3, 14, 15, 16]
  responses:
    '200':
      description: The stored plan with its evaluation.
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/ScenarioResponse
          examples:
            accepted:
              $ref: ../components/examples.yaml#/Scenario10
    '400':
      $ref: ../components/responses.yaml#/BadRequest
    '404':
      $ref: ../components/responses.yaml#/NotFound
    '409':
      $ref: ../components/responses.yaml#/Conflict
    '422':
      $ref: ../components/responses.yaml#/UnprocessableEntity
    '500':
      $ref: ../components/responses.yaml#/InternalError
