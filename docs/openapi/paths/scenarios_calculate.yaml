post:
  tags: [scenarios]
  operationId: calculateProposals
  summary: Compute proposals for all four plans — step 1 of "Generuj plany" (UC-10)
  description: |
    Pure computation — nothing is stored. Runs auto-seating for capacity 9, 10, 11 and 12 from the
    current guests, links and pins (pinned clusters stay at their table, `pinned: true`).
    "Generuj plany" stores the four results straight away: the SPA sends them unchanged to
    `PUT /scenarios` (one atomic call, version-checked) without showing a preview.
  responses:
    '200':
      description: Exactly four proposals, ordered 9, 10, 11, 12.
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/ProposalListResponse
          example:
            data:
              - capacity: 9
                basedOnVersion: 7
                plan:
                  summary:
                    tableCount: 12
                    seatedCount: 92
                    unseatedCount: 0
                    score: 301
                    violationCount: 0
                    needsRecalculation: false
                  tables:
                    - number: 1
                      fill: 8
                      score: 18
                      clusters:
                        - clusterKey: 4
                          guestIds: [4, 5]
                          pinned: true
                  unseated: []
                  guestScores:
                    - guestId: 4
                      tableNumber: 1
                      satisfaction: 4
                      preferredTotal: 20
                      preferredAtTable: 4
                      fallbackAtTable: 0
                      strangersAtTable: 2
                  violations: []
            meta:
              requestId: 01JB8Z6Q0K3N
            page:
              total: 4
    '400':
      $ref: ../components/responses.yaml#/BadRequest
    '500':
      $ref: ../components/responses.yaml#/InternalError
