post:
  tags: [scenarios]
  operationId: calculateProposals
  summary: Compute proposals for all five plans — step 1 of "Generuj plany" (UC-10)
  description: |
    Pure computation — nothing is stored. Runs auto-seating for the plans 9, 10, 11, 12 and mixed
    from the current guests, links and each plan's own pins (pinned clusters stay at their table,
    `pinned: true`). The uniform plans use the fewest tables (8 to capacity guests each). The mixed
    plan has 9–12 guests at every table and any number of tables: the layout with the highest
    bilans (satisfaction minus 2 per stranger pair, see `PlanSummary`), fewer tables on ties
    (docs/architecture/03-seating-model.md § The mixed plan). "Generuj plany" stores the five results
    straight away: the SPA sends them unchanged to `PUT /scenarios` (one atomic call,
    version-checked) without showing a preview.
  responses:
    '200':
      description: Exactly five proposals, ordered 9, 10, 11, 12, mixed.
      content:
        application/json:
          schema:
            $ref: ../components/schemas.yaml#/ProposalListResponse
          example:
            data:
              - key: '9'
                capacity: 9
                basedOnVersion: 7
                plan:
                  summary:
                    tableCount: 12
                    seatedCount: 92
                    unseatedCount: 0
                    score: 301
                    violationCount: 0
                    needsRecalculation: false
                  tables:
                    - number: 1
                      fill: 8
                      score: 18
                      clusters:
                        - clusterKey: 4
                          guestIds: [4, 5]
                          pinned: true
                  unseated: []
                  guestScores:
                    - guestId: 4
                      tableNumber: 1
                      satisfaction: 4
                      preferredTotal: 20
                      preferredAtTable: 4
                      fallbackAtTable: 0
                      strangersAtTable: 2
                  violations: []
            meta:
              requestId: 01JB8Z6Q0K3N
            page:
              total: 5
    '400':
      $ref: ../components/responses.yaml#/BadRequest
    '401':
      $ref: ../components/responses.yaml#/Unauthorized
    '403':
      $ref: ../components/responses.yaml#/Forbidden
    '500':
      $ref: ../components/responses.yaml#/InternalError
