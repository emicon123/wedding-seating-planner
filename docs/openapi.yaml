  responses:
    BadRequest:
      description: Malformed request (unparseable JSON, wrong content type, bad path parameter).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
              - code: bad_request
                field: null
                message: Request body is not valid JSON.
            meta:
              requestId: 01JB8Z6Q0K3N
    Unauthorized:
      description: |
        The access gate is on (`STOLIKI_PIN` configured) and the request carries no valid session cookie
        (missing, expired, tampered, or signed with an old key). The SPA shows the PIN screen.
        Never returned while the gate is off.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
              - code: unauthenticated
                field: null
                message: PIN required.
            meta:
              requestId: 01JB8Z6Q0K3N
    InternalError:
      description: Unexpected server error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
              - code: internal_error
                field: null
                message: Unexpected error; see server logs (request 01JB8Z6Q0K3N).
            meta:
              requestId: 01JB8Z6Q0K3N
    Forbidden:
      description: |
        CSRF guard (gate on only): a state-changing request (POST, PUT, PATCH, DELETE) without the header
        `X-Stoliki-Request: 1`. The SPA's API client always sends it; cross-site forms cannot.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
              - code: csrf_header_missing
                field: null
                message: Missing X-Stoliki-Request header.
            meta:
              requestId: 01JB8Z6Q0K3N
    UnprocessableEntity:
      description: Well-formed but violates a business rule (validation failed, duplicate name, invalid import).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
              - code: duplicate_name
                field: firstName
                message: A guest named "Ania Kowalska" already exists.
            meta:
              requestId: 01JB8Z6Q0K3N
    NotFound:
      description: The referenced guest, link, plan or table does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
              - code: not_found
                field: guestId
                message: Guest 999 does not exist.
            meta:
              requestId: 01JB8Z6Q0K3N
    Conflict:
      description: The `version` sent is stale — someone changed the resource meanwhile. Refetch and retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
              - code: version_conflict
                field: version
                message: Guest was changed by someone else (current version 4).
            meta:
              requestId: 01JB8Z6Q0K3N
    PayloadTooLarge:
      description: Body exceeds the limit (1 MB JSON, 2 MB CSV).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
              - code: payload_too_large
                field: null
                message: Request body exceeds 2 MB.
            meta:
              requestId: 01JB8Z6Q0K3N
    InvalidPin:
      description: |
        The PIN is wrong. The response is the same for every wrong value (no hint about length,
        digits or remaining attempts). Counts towards the attempt throttle.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
              - code: invalid_pin
                field: pin
                message: Wrong PIN.
            meta:
              requestId: 01JB8Z6Q0K3N
    TooManyAttempts:
      description: |
        Attempt throttle engaged (this client, or all clients together). The submitted PIN was **not**
        evaluated, so the response is identical whether it was right or wrong. Retry after the
        number of seconds in `Retry-After`.
      headers:
        Retry-After:
          description: Seconds until the next attempt is accepted.
          schema:
            type: integer
            minimum: 1
          example: 60
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
              - code: too_many_attempts
                field: null
                message: Too many attempts; try again later.
            meta:
              requestId: 01JB8Z6Q0K3N
  parameters:
    GuestId:
      name: guestId
      in: path
      required: true
      description: Guest id.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 4
    LinkKey:
      name: linkKey
      in: path
      required: true
      description: |
        The unordered guest pair as `{idA}-{idB}`. Either order is accepted;
        the server normalises to the smaller id first.
      schema:
        type: string
        pattern: ^[1-9][0-9]*-[1-9][0-9]*$
      example: 4-6
    DryRun:
      name: dryRun
      in: query
      required: false
      description: |
        `true` (default) only validates and returns the report. `false` commits:
        replaces ALL guests and links and clears all five plans.
      schema:
        type: boolean
        default: true
      example: true
    PlanKey:
      name: planKey
      in: path
      required: true
      description: |
        Identifies the plan: `9`, `10`, `11`, `12` (uniform plans; the same URLs as before task 013)
        or `mixed`. Any other value → 404 `not_found`.
      schema:
        $ref: '#/components/schemas/PlanKey'
      example: '10'
    TableNumber:
      name: tableNumber
      in: path
      required: true
      description: Table number within the plan (1..k).
      schema:
        type: integer
        minimum: 1
      example: 3
